name: Build Windows installer

# Push a tag like "v1.0.0" to build and publish a GitHub Release with the
# installer attached. Can also be run manually (Actions tab -> Run
# workflow) to build a test artifact without creating a release.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write  # needed to create a release and upload assets

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Install bundleable Chromium for Playwright
        # PLAYWRIGHT_BROWSERS_PATH=0 makes `playwright install` place the
        # browser inside the playwright package's own directory instead
        # of the OS-wide cache dir, so PyInstaller's built-in playwright
        # hook picks it up automatically as package data - no manual
        # --add-data plumbing needed for the ~150MB of browser binaries.
        run: playwright install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"

      - name: Trim unneeded Chromium data files
        # Several bundled Chromium files/folders have long, deeply-nested
        # names (locale .pak files, ad-privacy attestation data, media
        # preload data, isolated-web-app key data, CSS hyphenation
        # dictionaries) that are irrelevant to headless automation but,
        # combined with the CI runner's long checkout path
        # (D:\a\<repo>\<repo>\...), can exceed Windows' 260-char MAX_PATH
        # and abort the Inno Setup compile with "path not found" on
        # whichever file happens to be the longest. None of this affects
        # functionality since this app only drives Chromium headlessly to
        # scrape/download a page - it never renders any browser UI/features
        # that these files back. Trimming them also shrinks the installer.
        shell: pwsh
        run: |
          $pwDir = python -c "import playwright, os; print(os.path.dirname(playwright.__file__))"

          Get-ChildItem -Path $pwDir -Recurse -Directory -Filter "locales" | ForEach-Object {
            Get-ChildItem -Path $_.FullName -Filter "*.pak" | Where-Object { $_.Name -ne "en-US.pak" } | Remove-Item -Force
          }

          $foldersToRemove = "PrivacySandboxAttestationsPreloaded", "MEIPreload", "IwaKeyDistribution", "hyphen-data"
          foreach ($name in $foldersToRemove) {
            Get-ChildItem -Path $pwDir -Recurse -Directory -Filter $name | ForEach-Object {
              Remove-Item -Path $_.FullName -Recurse -Force
            }
          }

          # Each bundled browser's "resources\" dir (distinct from the
          # top-level resources.pak file) holds optional feature-specific
          # payloads (e.g. the reading-mode accessibility helper) that are
          # both irrelevant here and, going by prior CI failures, the last
          # thing enumerated in each browser's folder - safe to drop whole.
          $localBrowsersDir = Join-Path $pwDir "driver\package\.local-browsers"
          Get-ChildItem -Path $localBrowsersDir -Recurse -Directory -Filter "resources" | ForEach-Object {
            Remove-Item -Path $_.FullName -Recurse -Force
          }

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --windowed --name VW3ALanguageUpdater --icon packaging\icon\icon.ico --add-data "README.md;." --add-data "packaging\icon\icon-256.png;." vw3a_lang_updater.py

      - name: Derive version from tag
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Compile installer
        shell: cmd
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\installer.iss'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VW3ALanguageUpdater-Setup-${{ steps.version.outputs.version }}
          path: installer_output\*.exe

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" installer_output/*.exe \
            --title "${{ github.ref_name }}" \
            --generate-notes
